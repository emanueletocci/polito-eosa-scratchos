# Merges the chapter PDFs of the notes folder into a single PDF with cover,
# table of contents, part pages, bookmarks, and page numbers, and commits the
# result back to the repository.
#
# Layout: one subfolder of NOTES_DIR per part (1-Foundations, 2-ScratchOS, ...),
# a folder whose name contains "append" for the appendices.
name: Merge notes

on:
  push:
    paths:
      - "docs/notes/**/*.pdf"         # a chapter was added or updated, in any part
      - "docs/notes/logo.png"         # the cover logo changed
      - "scripts/merge_notes.py"
      - "!docs/notes/merged/**"       # never react to the merged PDF itself
  workflow_dispatch:                  # "Run workflow" button in the Actions tab

permissions:
  contents: write                     # needed to commit the merged PDF

env:
  NOTES_DIR: docs/notes                                # folder with one subfolder per part
  OUTPUT: docs/notes/merged/embedded-os-notes.pdf      # merged PDF
  TOC_DEPTH: "2"                                       # 1 chapters, 2 + sections, 3 + subsections
  LOGO: docs/notes/logo.png                            # PNG or JPG for the cover (optional)
  TITLE: "Embedded Operating Systems and Architecture"
  COURSE_CODE: "01WMQWQ"
  PROGRAM: "MSc in Cybersecurity Engineering"
  YEAR: "2026/27"
  PROFESSOR: "Stefano Di Carlo"
  AUTHOR: "Emanuele Tocci"

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF libraries
        run: pip install pypdf==5.9.0 reportlab==4.4.10

      - name: Merge the chapters
        run: python scripts/merge_notes.py

      - name: Commit the merged PDF
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT"
          if git diff --cached --quiet; then
            echo "Merged PDF unchanged, nothing to commit."
          else
            git commit -m "Merge notes into a single PDF [skip ci]"
            git push
          fi

      - name: Publish the merged PDF as a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: notes-latest                              # one release, updated at every run
        run: |
          NOTES="Latest version of the notes, generated on $(date -u +'%d/%m/%Y %H:%M') UTC from commit ${GITHUB_SHA::7}."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TITLE – notes" --notes "$NOTES" --latest
          fi
          gh release upload "$TAG" "$OUTPUT" --clobber    # replace the PDF of the previous run
